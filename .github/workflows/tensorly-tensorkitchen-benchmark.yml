name: TensorLy vs TensorKitchen paired benchmark
on:
  push:
    branches: [experiments/tensorly-vs-tensorkitchen-20261027]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '1'
      BENCH_MODE: smoke
      BENCH_T: '60'
      BENCH_R: '3'
      BENCH_STARTS: '1'
      BENCH_MAXITER: '35'
      BENCH_PHEN_TRAIN: '64'
      BENCH_CONT_TRAIN: '80'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TensorLy and evaluation dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 pandas==2.2.3 tensorly==0.9.0
      - name: Install official TensorKitchen pinned commit
        run: |
          mkdir -p benchmarks/tensorly_tensorkitchen/juliaenv
          julia --project=benchmarks/tensorly_tensorkitchen/juliaenv -e 'using Pkg; Pkg.add(Pkg.PackageSpec(url="https://github.com/TensorKitchen/TensorKitchen.jl.git",rev="cc843ac1e98b5574c8c2a3db61580bf93419386b")); Pkg.status()'
      - name: Generate identical observation tensors
        run: python benchmarks/tensorly_tensorkitchen/benchmark.py generate --mode smoke
      - name: TensorLy CPD
        run: python benchmarks/tensorly_tensorkitchen/benchmark.py tensorly --mode smoke
      - name: TensorKitchen CPD and NNCPD
        run: julia --project=benchmarks/tensorly_tensorkitchen/juliaenv benchmarks/tensorly_tensorkitchen/benchmark.jl
      - name: Evaluate same downstream models
        run: python benchmarks/tensorly_tensorkitchen/benchmark.py evaluate --mode smoke
      - name: Display head-to-head table
        run: cat benchmarks/tensorly_tensorkitchen/results/smoke/comparison_metrics.csv
      - name: Upload benchmark metrics and factor outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rw-tensorly-tensorkitchen-benchmark
          path: |
            benchmarks/tensorly_tensorkitchen/results/
            benchmarks/tensorly_tensorkitchen/juliaenv/Manifest.toml
          if-no-files-found: warn
