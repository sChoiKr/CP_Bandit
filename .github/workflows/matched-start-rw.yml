name: Matched-start RW decomposition benchmark
on:
  push:
    branches: [experiments/matched-initialization-20261027]
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/tensorly_tensorkitchen/**'
      - '.github/workflows/matched-start-rw.yml'
  workflow_dispatch:
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, start: 0, end: 5}
          - {shard: 1, start: 5, end: 10}
          - {shard: 2, start: 10, end: 15}
          - {shard: 3, start: 15, end: 20}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '1'
      RW_ENV_START: ${{ matrix.start }}
      RW_ENV_END: ${{ matrix.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned TensorLy and evaluators
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 pandas==2.2.3 tensorly==0.9.0 threadpoolctl==3.5.0
      - name: Install pinned official TensorKitchen
        run: |
          mkdir -p benchmarks/tensorly_tensorkitchen/juliaenv
          julia --project=benchmarks/tensorly_tensorkitchen/juliaenv -e 'using Pkg; Pkg.add(Pkg.PackageSpec(url="https://github.com/TensorKitchen/TensorKitchen.jl.git",rev="cc843ac1e98b5574c8c2a3db61580bf93419386b")); Pkg.status()'
      - name: Generate shared tensors and deterministic CP starts
        run: python benchmarks/tensorly_tensorkitchen/matched_suite.py generate
      - name: TensorLy CP-ALS and NNCPD HALS
        run: python benchmarks/tensorly_tensorkitchen/matched_suite.py tensorly
      - name: TensorKitchen CP-ALS and NNCPD HALS with identical starts
        run: julia --project=benchmarks/tensorly_tensorkitchen/juliaenv benchmarks/tensorly_tensorkitchen/matched_suite.jl
      - name: Common Python projection / classification / regression
        run: python benchmarks/tensorly_tensorkitchen/matched_suite.py evaluate
      - name: Inspect paired and per-method score tables
        run: |
          find benchmarks/tensorly_tensorkitchen/results/matched -name paired.csv -exec head -8 {} \;
      - name: Upload reproducible matched inputs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rw-matched-start-shard-${{ matrix.shard }}
          path: |
            benchmarks/tensorly_tensorkitchen/results/matched/
            benchmarks/tensorly_tensorkitchen/juliaenv/Manifest.toml
          if-no-files-found: warn
          retention-days: 30
