name: Full TensorLy vs TensorKitchen RW benchmark
on:
  push:
    branches: [experiments/tensorly-vs-tensorkitchen-full-20261027]
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/tensorly_tensorkitchen/**'
      - 'benchmarks/rank_geometry/**'
      - '.github/workflows/tensorly-tensorkitchen-full.yml'
  workflow_dispatch:
jobs:
  benchmark:
    if: github.head_ref != 'experiments/rank-parameter-geometry-20261027'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, start: 0, end: 5}
          - {shard: 1, start: 5, end: 10}
          - {shard: 2, start: 10, end: 15}
          - {shard: 3, start: 15, end: 20}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TensorLy and common evaluation tools
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.6.1 pandas==2.2.3 tensorly==0.9.0
      - name: Install official TensorKitchen (pinned)
        run: |
          mkdir -p benchmarks/tensorly_tensorkitchen/juliaenv
          julia --project=benchmarks/tensorly_tensorkitchen/juliaenv -e 'using Pkg; Pkg.add(Pkg.PackageSpec(url="https://github.com/TensorKitchen/TensorKitchen.jl.git",rev="cc843ac1e98b5574c8c2a3db61580bf93419386b")); Pkg.status()'
      - name: Generate matched reward environments and train/test tensors
        env:
          RW_ENV_START: ${{ matrix.start }}
          RW_ENV_END: ${{ matrix.end }}
        run: python benchmarks/tensorly_tensorkitchen/full_suite.py generate
      - name: TensorLy CPD all starts
        env:
          RW_ENV_START: ${{ matrix.start }}
          RW_ENV_END: ${{ matrix.end }}
        run: python benchmarks/tensorly_tensorkitchen/full_suite.py tensorly
      - name: TensorKitchen CPD NNCPD after warmup
        env:
          RW_ENV_START: ${{ matrix.start }}
          RW_ENV_END: ${{ matrix.end }}
        run: julia --project=benchmarks/tensorly_tensorkitchen/juliaenv benchmarks/tensorly_tensorkitchen/benchmark_full.jl
      - name: Common evaluation and paired comparison
        env:
          RW_ENV_START: ${{ matrix.start }}
          RW_ENV_END: ${{ matrix.end }}
        run: python benchmarks/tensorly_tensorkitchen/full_suite.py evaluate
      - name: Save complete shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rw-full-shard-${{ matrix.shard }}
          path: |
            benchmarks/tensorly_tensorkitchen/results/full/
            benchmarks/tensorly_tensorkitchen/juliaenv/Manifest.toml
          if-no-files-found: warn
          retention-days: 30

  rank_geometry:
    if: github.head_ref == 'experiments/rank-parameter-geometry-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 280
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, start: 0, end: 5}
          - {shard: 1, start: 5, end: 10}
          - {shard: 2, start: 10, end: 15}
          - {shard: 3, start: 15, end: 20}
    env:
      OPENBLAS_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '1'
      RW_ENV_START: ${{ matrix.start }}
      RW_ENV_END: ${{ matrix.end }}
      RW_GEOM_MC: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - name: Install TensorKitchen pinned
        run: |
          mkdir -p benchmarks/rank_geometry/juliaenv
          julia --project=benchmarks/rank_geometry/juliaenv -e 'using Pkg; Pkg.add(Pkg.PackageSpec(url="https://github.com/TensorKitchen/TensorKitchen.jl.git",rev="cc843ac1e98b5574c8c2a3db61580bf93419386b"))'
      - name: Generate observation tensors
        run: python benchmarks/rank_geometry/geometry.py generate
      - name: Fit rank-dependent CPD subspaces
        run: julia --project=benchmarks/rank_geometry/juliaenv benchmarks/rank_geometry/fit_dictionaries.jl
      - name: Monte Carlo Jacobian projections
        run: python benchmarks/rank_geometry/geometry.py geometry
      - name: Save geometry results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank-geometry-shard-${{ matrix.shard }}
          path: benchmarks/rank_geometry/results/rank_geometry/
          retention-days: 30
          if-no-files-found: warn
