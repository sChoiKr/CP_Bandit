name: RW CP rank and parameter Jacobian geometry
on:
  push:
    branches: [experiments/rank-parameter-geometry-20261027]
  workflow_dispatch:
jobs:
  geometry:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, start: 0, end: 5}
          - {shard: 1, start: 5, end: 10}
          - {shard: 2, start: 10, end: 15}
          - {shard: 3, start: 15, end: 20}
    runs-on: ubuntu-latest
    timeout-minutes: 280
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '1'
      RW_ENV_START: ${{ matrix.start }}
      RW_ENV_END: ${{ matrix.end }}
      RW_GEOM_MC: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install numpy==2.1.3
      - name: Install pinned TensorKitchen
        run: |
          mkdir -p benchmarks/rank_geometry/juliaenv
          julia --project=benchmarks/rank_geometry/juliaenv -e 'using Pkg; Pkg.add(Pkg.PackageSpec(url="https://github.com/TensorKitchen/TensorKitchen.jl.git",rev="cc843ac1e98b5574c8c2a3db61580bf93419386b")); Pkg.status()'
      - name: Generate identical training tensors for ranks 2,3,4,5,6,8
        run: python benchmarks/rank_geometry/geometry.py generate
      - name: Fit TensorKitchen CPD dictionaries with three starts
        run: julia --project=benchmarks/rank_geometry/juliaenv benchmarks/rank_geometry/fit_dictionaries.jl
      - name: Compute Jacobian projected singular values and conditional alpha sensitivity
        run: python benchmarks/rank_geometry/geometry.py geometry
      - name: Upload rank-geometry experimental results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank-parameter-geometry-shard-${{ matrix.shard }}
          path: |
            benchmarks/rank_geometry/results/rank_geometry/
            benchmarks/rank_geometry/juliaenv/Manifest.toml
          retention-days: 30
          if-no-files-found: warn
